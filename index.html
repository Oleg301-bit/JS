<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script defer src="./src/dom.js"></script> -->
    <script defer type="module" src="./src/events.js"></script>
    <title>JavaScript</title>
    <script>
      function showText() {
        console.log('text');
      }
    </script>
  </head>
  <body>
    <h1>JavaScript</h1>
    <a href=""></a>
    <div id="container" class="div-count p-count">
      <p id="first-part" onclick="showText()">
        Fisrt Part так не делать в html!
      </p>
      <p id="second-part">Second Part</p>
      <p>Third Part</p>
      <p>Fourth Part</p>
      <p>Fifth Partss</p>
    </div>
    <div class="image-container">
      <img
        src="./assets/image/image.jpg"
        alt="image"
        width="250px"
        height="250px"
      />
    </div>
    <div class="anchors">
      <a href="./assets/pages/title.html" name="anchors">Anchors</a>
    </div>
    <form id="person">
      <div>
        <label for="f-name">First Name</label>
        <input type="text" id="f-name" name="firstName" />
      </div>
      <div>
        <label for="l-name"> Last Name</label>
        <input type="text" id="l-name" name="LastName" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="text" id="email" name="Email" />
      </div>
      <div>
        <label for="nick-name"> Nick Name</label>
        <input type="text" id="nick-name" name="nickName" />
      </div>
      <div id="btn-container">
        <button>OK</button>
        <button>Cancel</button>
      </div>
    </form>
    <form id="rate">
      <div>
        <label for="win">Winner</label>
        <input type="text" id="win" name="winner" />
      </div>
      <div>
        <label for="loose">Looser</label>
        <input type="text" id="loose" name="looser" />
      </div>
      <div>
        <span id="new-rate"></span>
      </div>
      <div class="btn">
        <button>Calculate</button>
      </div>
    </form>
  </body>
</html>
